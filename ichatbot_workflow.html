<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Portfolio Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-zinc-950 flex items-center justify-center h-screen">
    <div
      class="w-full bg-[#121212] text-white rounded-xl shadow-2xl flex flex-col h-full border border-zinc-800 p-20 pb-4"
    >
      <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 p-10"></div>

      <div class="w-1/2 mx-auto">
        <form
          id="chat-form"
          class="center p-3 border-t border-zinc-800 flex gap-2 bg-[#181818] rounded-xl shadow-2xl"
        >
          <input
            type="text"
            id="user-input"
            placeholder="Type here..."
            class="flex-1 bg-[#222] border border-zinc-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-zinc-500"
          />
          <button
            type="submit"
            class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm transition-colors"
          >
            Send
          </button>
        </form>
      </div>
    </div>

    <script>
      const form = document.getElementById("chat-form");
      const input = document.getElementById("user-input");
      const chatBox = document.getElementById("chat-box");
      let messages = [
        // { role: "user", content: "Hi" },
        // { role: "assistant", content: "Hello! How can I assist you today?" },
        // { role: "user", content: "My name is nitish" },
        // {
        //   role: "assistant",
        //   content: "Nice to meet you, Nitish! How can I help you today?",
        // },
        // { role: "user", content: "What is the capital of India" },
      ];

      function renderChat() {
        chatBox.innerHTML = "";
        messages.forEach((msg) => {
          if (msg.role === "user") {
            chatBox.innerHTML += `
                        <div class="flex justify-end">
                            <div class="max-w-[80%] p-3 rounded-lg text-sm bg-[#2A2A2A] text-white rounded-br-none">
                                ${msg.content}
                            </div>
                        </div>`;
          } else {
            chatBox.innerHTML += `
                        <div class="flex justify-start">
                            <div class="max-w-[80%] p-3 rounded-lg text-sm bg-[#1E1E1E] text-zinc-200 border border-zinc-700 rounded-bl-none">
                                ${msg.content}
                            </div>
                        </div>`;
          }
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      renderChat();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        messages.push({ role: "user", content: text });
        input.value = "";
        renderChat();

        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="max-w-[80%] p-3 rounded-lg text-sm bg-[#1E1E1E] text-zinc-500 border border-zinc-700 italic">
                        Thinking...
                    </div>
                </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
          const res = await fetch("http://127.0.0.1:8000/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              thread_id: "portfolio-user",
            }),
          });
          const data = await res.json();

          messages.push({ role: "assistant", content: data.reply });
          renderChat();
        } catch (err) {
          console.error(err);
          document.getElementById(loadingId)?.remove();
          messages.push({
            role: "assistant",
            content: "Error: Unable to connect to backend chatbot.",
          });
          renderChat();
        }
      });
    </script>
  </body>
</html>
